# Entorno conda para el currículum.
#
#   conda env create -f environment.yml
#   conda activate qfcurriculum
#
# Deja las versiones sin fijar a propósito: para el conjunto exacto verificado
# usar `pip install -r requirements-lock.txt` dentro del entorno.
name: qfcurriculum
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - scipy
  - matplotlib
  - jupyter
  - pytest
  - pip
  - pip:
      - QuantLib
      - -e .
