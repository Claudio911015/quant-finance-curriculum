name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: lint (calidad de notebooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Chequeos estaticos: no ejecuta notebooks, tarda segundos.
      # Cubre asserts tautologicos, factores de ajuste sin derivar, encabezados
      # sin prosa, notebooks sin validacion, enlaces rotos del README y
      # coherencia entre el lock y pyproject.
      - name: Lint
        run: python tools/lint_notebooks.py

  tests:
    name: pytest (qflib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-lock.txt
          pip install -e .
      - name: Run test suite
        run: pytest tests/ -v

  notebooks:
    # Un job por modulo, en paralelo: el reloj lo marca el modulo mas lento,
    # no la suma de los 56 notebooks. fail-fast off para ver TODOS los modulos
    # que fallan en una sola corrida, no solo el primero.
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - 00-probabilidad
          - 01-procesos-estocasticos
          - 02-tiempo-discreto
          - 03-tiempo-continuo
          - 04-metodos-numericos
          - 05-curvas
          - 06-tasa-corta
          - 07-hjm-lmm
          - 08-volatilidad
          - 09-fx
          - 10-credito
          - 11-xva
          - 12-riesgo-mercado
          - 13-sofr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-lock.txt
          pip install -e .
          python -m ipykernel install --user --name python3
      # Cada notebook trae sus propios asserts, asi que ejecutarlo ES validarlo.
      # check_outputs_fresh.py ademas compara las salidas de texto frescas contra
      # las comprometidas: detecta notebooks cuyos numeros publicados en GitHub
      # ya no son los que produce el codigo. Ejecuta una sola vez, asi que este
      # chequeo extra no cuesta tiempo adicional.
      - name: Execute notebooks and check committed outputs
        run: |
          status=0
          for nb in notebooks/${{ matrix.module }}/*.ipynb; do
            echo "::group::$nb"
            if python tools/check_outputs_fresh.py "$nb"; then
              :
            else
              echo "::error file=$nb::fallo un assert de validacion, o las salidas comprometidas estan rancias"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
