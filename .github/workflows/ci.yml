name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: pytest (qflib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-lock.txt
          pip install -e .
      - name: Run test suite
        run: pytest tests/ -v

  notebooks:
    # Un job por modulo, en paralelo: el reloj lo marca el modulo mas lento,
    # no la suma de los 56 notebooks. fail-fast off para ver TODOS los modulos
    # que fallan en una sola corrida, no solo el primero.
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - 00-probabilidad
          - 01-procesos-estocasticos
          - 02-tiempo-discreto
          - 03-tiempo-continuo
          - 04-metodos-numericos
          - 05-curvas
          - 06-tasa-corta
          - 07-hjm-lmm
          - 08-volatilidad
          - 09-fx
          - 10-credito
          - 11-xva
          - 12-riesgo-mercado
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-lock.txt
          pip install -e .
          python -m ipykernel install --user --name python3
      # Cada notebook trae sus propios asserts de validacion, asi que
      # ejecutarlo ES validarlo: si un assert falla, nbconvert sale con error.
      - name: Execute notebooks
        run: |
          status=0
          for nb in notebooks/${{ matrix.module }}/*.ipynb; do
            echo "::group::$nb"
            if python -m jupyter nbconvert --to notebook --execute --stdout \
                 --ExecutePreprocessor.kernel_name=python3 \
                 --ExecutePreprocessor.timeout=600 \
                 "$nb" > /dev/null; then
              echo "OK $nb"
            else
              echo "::error file=$nb::fallo la ejecucion o un assert de validacion"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
